# Pro-audio tuning for the RME AIO Pro (pci-0000_08_00.0).
#
# Headroom was 0, so every late graph wake-up became a resync rather than being
# absorbed, showing up in the journal as:
#   spa.alsa: hw:0,0p: follower avail:547 delay:547 target:256 thr:256, resync
# 128 frames buys half a millisecond at 48kHz without changing the reported latency
# enough to matter.
#
# Deliberately does NOT set clock.min-quantum / clock.max-quantum: clamping those
# breaks this card.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_.*pci-0000_08_00.0.*" }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 128
      }
    }
  }

  # Keep unused devices out of the graph entirely. They otherwise join as
  # followers on their own clocks and get adaptively resampled against the RME,
  # which costs drift-correction work and produces resync glitches. The onboard
  # PCH input ("front:3") was doing exactly that.
  #
  # Cost: no HDMI audio, no UR22. Delete this file and
  # `systemctl --user restart wireplumber` to get them back.
  {
    matches = [
      { node.name = "~alsa_.*pci-0000_01_00.1.*" }               # Nvidia HDMI outs
      { node.name = "~alsa_.*usb-Yamaha_Corporation_Steinberg_UR22.*" }
      { node.name = "~alsa_input.pci-0000_00_1f.3.*" }           # onboard PCH analog in
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
